# Конфигурация по умолчанию. Значения подобраны по результатам бенчмарков,
# см. reports/benchmarks.csv и дашборд в UI.

corpus:
  pages_dir: bs_6/docs/data/pages
  media_dir: bs_6/docs/data/media
  namespaces: ["ru"]
  doc_url_template: "https://docs.business-studio.ru/doku.php/{page_id}"
  min_chars: 120
  drop_index_pages: true

chunking:
  strategy: header_recursive
  chunk_size: 512
  chunk_overlap_ratio: 0.15
  table_mode: markdown
  prepend_breadcrumb: true

embedding:
  model_name: deepvk/USER-bge-m3
  query_prefix: ""
  passage_prefix: ""
  batch_size: 32
  device: auto
  normalize: true

retrieval:
  mode: hybrid
  top_k: 5
  # 16 кандидатов: на M4 реранкер ~1.5–2 с, качество на пробных вопросах как у 40.
  candidates: 16
  use_reranker: true
  reranker_model: BAAI/bge-reranker-v2-m3

generation:
  model: qwen3:8b
  base_url: http://localhost:11434
  temperature: 0.1
  num_ctx: 8192
  max_tokens: 1024
  think: false

paths:
  processed: data/processed
  index: data/index
  cache: data/cache
  goldset: data/goldset
  reports: reports
