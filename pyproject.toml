[project]
name = "bs-semantic"
version = "0.1.0"
description = "Локальный семантический поиск и RAG по справке Business Studio (DokuWiki)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    "langchain-text-splitters>=0.3.8",
    "langchain-huggingface>=0.3.0",
    "langchain-ollama>=0.3.3",
    "langchain-qdrant>=0.2.0",
    "langchain-experimental>=0.3.4",
    "qdrant-client>=1.13.0",
    "fastembed>=0.5.1",
    "sentence-transformers>=5.0.0",
    "torch>=2.5.0",
    "transformers>=4.51.0",
    "typer>=0.15.1",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "pandas>=2.2.3",
    "pyarrow>=18.1.0",
    "numpy>=1.26,<2.3",
    "ranx>=0.3.20",
    "mlflow>=2.20.0",
    "streamlit>=1.41.0",
    "plotly>=5.24.1",
    "tiktoken>=0.8.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "ruff>=0.9.0"]

[project.scripts]
bsrag = "bsrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsrag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
